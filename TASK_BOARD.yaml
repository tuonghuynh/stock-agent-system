board_version: 2
lead:
  owner: lead-codex
  integration_branch: codex/python-phase0
  validated_commit: eb01d58
  contract_version: contracts-v1-python

statuses: [BLOCKED, READY, ACTIVE, REVIEW, MERGED, VALIDATED, SUPERSEDED]

rules:
  maximum_concurrent_implementation_workers: 4
  one_worktree_per_worker: true
  overlapping_owned_paths_allowed: false
  workers_may_merge: false
  workers_may_edit_progress: false
  workers_may_edit_task_board: false
  live_trading_changes_allowed: false

waves:
