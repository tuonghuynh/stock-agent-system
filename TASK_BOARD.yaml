        owner: lead
        status: VALIDATED
        requirements: [POL-001, COR-001, CHG-001]
        acceptance_tests: [AT-001, AT-002]
        scope: Bootstrap, canonical contracts, build, migrations and fixtures

  - id: WAVE-1
    prerequisite: P0-BOOT-001 VALIDATED
    integration_gate: module tests, full verify and fake-broker lifecycle green
    tasks:
