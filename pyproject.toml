[project]
name = "stock-agent-system"
version = "0.1.0"
description = "Deterministic multi-agent paper-trading system"
requires-python = ">=3.13,<3.14"
dependencies = [
  "alembic>=1.14,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "pyyaml>=6,<7",
  "sqlalchemy>=2.0,<3",
  "structlog>=25,<26",
  "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
  "mypy>=1.15,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "pytest-xdist>=3.6,<4",
  "ruff>=0.11,<1",
  "testcontainers[postgres]>=4.10,<5",
  "types-pyyaml>=6,<7",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stock_agent"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
markers = ["postgres: requires a real PostgreSQL service"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*.py" = ["E501"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["stock_agent"]

[tool.coverage.run]
branch = true
source = ["stock_agent"]
